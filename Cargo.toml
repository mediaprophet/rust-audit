[workspace]
resolver = "2"
members = [
    "crates/audit-cli",
    "crates/audit-core",
    "crates/audit-extract",
    "crates/audit-rdf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-wgsl-bevy = "0.1"
